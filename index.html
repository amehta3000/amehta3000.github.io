<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ameet Mehta · Projects</title>
  <meta name="description" content="Apps, games, websites and music by Ameet Mehta." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0b0c;
      --row-hover: #18181a;
      --text: #ededee;
      --muted: #8b8b90;
      --faint: #5a5a5f;
      --border: #1f1f22;
      --accent: #e879f9;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Manrope, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 16px 80px; }

    header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 36px; }
    header h1 { font-size: 34px; font-weight: 500; letter-spacing: -0.01em; margin: 0; }
    header .count { color: var(--muted); font-size: 18px; }
    header .gh { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 16px; }
    header .gh:hover { text-decoration: underline; text-underline-offset: 4px; }

    .row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr) 24px 160px;
      align-items: center;
      gap: 16px;
      padding: 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .head {
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: none;
      padding-bottom: 10px;
    }
    .item { position: relative; transition: background .12s ease; }
    .item:hover { background: var(--row-hover); }
    .item .date { color: var(--muted); font-variant-numeric: tabular-nums; }
    .name {
      text-decoration: underline;
      text-decoration-color: var(--faint);
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 4px 0 7px; margin: -4px 0 -7px;
    }
    /* Make the whole row clickable */
    .name::after { content: ""; position: absolute; inset: 0; }
    .item:hover .name { text-decoration-color: var(--text); }
    .arrow { color: var(--muted); opacity: 0; transition: opacity .12s ease; text-align: center; }
    .item:hover .arrow { opacity: 1; }
    .cat { color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

    .state { padding: 48px 12px; color: var(--muted); }
    .state a { color: var(--accent); }

    @media (max-width: 640px) {
      body { font-size: 16px; }
      header h1 { font-size: 28px; }
      .row { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 14px 4px; }
      .date, .arrow { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
  <script>
    // ---- Config ---------------------------------------------------------
    const USER = "amehta3000";
    // Repos with GitHub Pages enabled are listed automatically.
    // Add repo names here to hide them.
    const EXCLUDE = [`${USER}.github.io`];
    // Category comes from the first matching repo topic (add e.g. "game"
    // as a topic on GitHub), or from this map, otherwise "App".
    const CATEGORIES = {
      app: "#a78bfa",
      game: "#f472b6",
      website: "#38bdf8",
      music: "#fbbf24",
      video: "#fb7185",
      tool: "#34d399",
      experiment: "#94a3b8",
    };
    const CATEGORY_OVERRIDES = {
      // "drift-raja": "game",
    };
    // ---------------------------------------------------------------------

    const { useEffect, useState } = React;
    const html = htm.bind(React.createElement);

    const prettify = (name) =>
      name.replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

    const appUrl = (repo) =>
      repo.homepage && /^https?:\/\//.test(repo.homepage)
        ? repo.homepage
        : `https://${USER}.github.io/${repo.name}/`;

    const categoryOf = (repo) =>
      CATEGORY_OVERRIDES[repo.name] ||
      (repo.topics || []).find((t) => t in CATEGORIES) ||
      "app";

    const fmtDate = (iso) => {
      const d = new Date(iso);
      const sameYear = d.getFullYear() === new Date().getFullYear();
      return d.toLocaleDateString("en-US", sameYear
        ? { month: "short", day: "numeric" }
        : { month: "short", year: "numeric" });
    };

    async function fetchRepos() {
      const all = [];
      for (let page = 1; page <= 10; page++) {
        const res = await fetch(
          `https://api.github.com/users/${USER}/repos?per_page=100&page=${page}&sort=pushed`,
          { headers: { Accept: "application/vnd.github+json" } }
        );
        if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
        const batch = await res.json();
        all.push(...batch);
        if (batch.length < 100) break;
      }
      return all
        .filter((r) => r.has_pages && !r.fork && !r.archived && !EXCLUDE.includes(r.name))
        .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
    }

    function Row({ repo }) {
      const cat = categoryOf(repo);
      return html`
        <div class="row item">
          <span class="date">${fmtDate(repo.pushed_at)}</span>
          <a class="name" href=${appUrl(repo)} title=${repo.description || ""}>${prettify(repo.name)}</a>
          <span class="arrow" aria-hidden="true">↗</span>
          <span class="cat">
            <span class="dot" style=${{ background: CATEGORIES[cat] }}></span>
            ${cat[0].toUpperCase() + cat.slice(1)}
          </span>
        </div>`;
    }

    function App() {
      const [repos, setRepos] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetchRepos().then(setRepos).catch((e) => setError(e.message));
      }, []);

      return html`
        <div class="wrap">
          <header>
            <h1>Ameet Mehta</h1>
            ${repos && html`<span class="count">${repos.length} projects</span>`}
            <a class="gh" href=${`https://github.com/${USER}`}>GitHub ↗</a>
          </header>

          <div class="row head">
            <span class="date">Updated ↓</span>
            <span>Project</span>
            <span class="arrow"></span>
            <span>Category</span>
          </div>

          ${error
            ? html`<div class="state">Couldn't load projects (${error}).
                See them on <a href=${`https://github.com/${USER}?tab=repositories`}>GitHub</a>.</div>`
            : !repos
            ? html`<div class="state">Loading…</div>`
            : repos.map((r) => html`<${Row} key=${r.id} repo=${r} />`)}
        </div>`;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
