<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ameet Mehta · Projects</title>
  <meta name="description" content="Apps, games, websites and music by Ameet Mehta." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0b0c;
      --row-hover: #18181a;
      --text: #ededee;
      --muted: #8b8b90;
      --faint: #5a5a5f;
      --border: #1f1f22;
      --tile: #232327;
      --accent: #e879f9;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Manrope, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 40px 16px 80px; }

    header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 36px; }
    header h1 { font-size: 34px; font-weight: 500; letter-spacing: -0.01em; margin: 0; }
    header .count { color: var(--muted); font-size: 18px; }
    header .gh { margin-left: auto; color: var(--accent); text-decoration: none; font-size: 16px; }
    header .gh:hover { text-decoration: underline; text-underline-offset: 4px; }

    .row {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(0, 1fr) 120px 90px 80px;
      align-items: center;
      gap: 20px;
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
    }
    .head {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: none;
      padding-bottom: 8px;
    }
    .item { position: relative; transition: background .12s ease; }
    .item:hover { background: var(--row-hover); }

    .proj { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .icon {
      width: 24px; height: 24px; flex: none; border-radius: 6px;
      background: var(--tile); object-fit: contain;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 600; color: var(--muted);
    }
    img.icon { background: transparent; }
    .name {
      text-decoration: underline;
      text-decoration-color: var(--faint);
      text-underline-offset: 5px;
      text-decoration-thickness: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 4px 0 7px; margin: -4px 0 -7px;
    }
    /* Make the whole row clickable */
    .name::after { content: ""; position: absolute; inset: 0; }
    .item:hover .name { text-decoration-color: var(--text); }

    .desc { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lang { color: var(--muted); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
    .item .date { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .none { color: var(--faint); }

    .state { padding: 48px 12px; color: var(--muted); }
    .state a { color: var(--accent); }

    @media (max-width: 900px) {
      .row { grid-template-columns: minmax(150px, 200px) minmax(0, 1fr) 80px; }
      .lang, .started { display: none; }
    }
    @media (max-width: 600px) {
      header h1 { font-size: 28px; }
      .head { display: none; }
      .row { grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 14px 4px; }
      .item .date { display: none; }
      .desc { padding-left: 36px; font-size: 14px; white-space: normal;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .desc.none { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
  <script>
    // ---- Config ---------------------------------------------------------
    const USER = "amehta3000";
    // Repos with GitHub Pages enabled are listed automatically.
    // Add repo names here to hide them.
    const EXCLUDE = [`${USER}.github.io`];
    // ---------------------------------------------------------------------

    const LANG_COLORS = {
      TypeScript: "#3178c6", JavaScript: "#f1e05a", Python: "#3572a5", HTML: "#e34c26",
      CSS: "#663399", Svelte: "#ff3e00", Vue: "#41b883", Swift: "#f05138", Rust: "#dea584",
      Go: "#00add8", "C#": "#178600", "C++": "#f34b7d", GLSL: "#5686a5", Shell: "#89e051",
    };

    const { useEffect, useState } = React;
    const html = htm.bind(React.createElement);

    const prettify = (name) =>
      name.replace(/[-_]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());

    const appUrl = (repo) =>
      repo.homepage && /^https?:\/\//.test(repo.homepage)
        ? repo.homepage
        : `https://${USER}.github.io/${repo.name}/`;

    const fmtDate = (iso) => {
      const d = new Date(iso);
      const sameYear = d.getFullYear() === new Date().getFullYear();
      return d.toLocaleDateString("en-US", sameYear
        ? { month: "short", day: "numeric" }
        : { month: "short", year: "numeric" });
    };
    const fmtMonth = (iso) =>
      new Date(iso).toLocaleDateString("en-US", { month: "short", year: "numeric" });

    async function fetchRepos() {
      const all = [];
      for (let page = 1; page <= 10; page++) {
        const res = await fetch(
          `https://api.github.com/users/${USER}/repos?per_page=100&page=${page}&sort=pushed`,
          { headers: { Accept: "application/vnd.github+json" } }
        );
        if (!res.ok) throw new Error(`GitHub API returned ${res.status}`);
        const batch = await res.json();
        all.push(...batch);
        if (batch.length < 100) break;
      }
      return all
        .filter((r) => r.has_pages && !r.fork && !r.archived && !EXCLUDE.includes(r.name))
        .sort((a, b) => new Date(b.pushed_at) - new Date(a.pushed_at));
    }

    // Read the app's own page for its favicon. Apps live on this same origin,
    // so this doesn't count against GitHub's API limit.
    async function findIcon(url) {
      try {
        const res = await fetch(url);
        if (!res.ok) return null;
        const doc = new DOMParser().parseFromString(await res.text(), "text/html");
        const link =
          doc.querySelector('link[rel="apple-touch-icon"]') ||
          doc.querySelector('link[rel~="icon"]');
        return new URL(link ? link.getAttribute("href") : "favicon.ico", url).href;
      } catch {
        return null;
      }
    }

    function Icon({ repo }) {
      const [src, setSrc] = useState(null);
      const [failed, setFailed] = useState(false);
      useEffect(() => { findIcon(appUrl(repo)).then(setSrc); }, [repo]);
      if (src && !failed) {
        return html`<img class="icon" src=${src} alt="" onError=${() => setFailed(true)} />`;
      }
      return html`<span class="icon" aria-hidden="true">${repo.name[0].toUpperCase()}</span>`;
    }

    function Row({ repo }) {
      return html`
        <div class="row item">
          <span class="proj">
            <${Icon} repo=${repo} />
            <a class="name" href=${appUrl(repo)}>${prettify(repo.name)}</a>
          </span>
          <span class=${repo.description ? "desc" : "desc none"} title=${repo.description || ""}>
            ${repo.description || "—"}
          </span>
          <span class="lang">
            ${repo.language
              ? html`<span class="dot" style=${{ background: LANG_COLORS[repo.language] }}></span>${repo.language}`
              : html`<span class="none">—</span>`}
          </span>
          <span class="date started">${fmtMonth(repo.created_at)}</span>
          <span class="date">${fmtDate(repo.pushed_at)}</span>
        </div>`;
    }

    function App() {
      const [repos, setRepos] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetchRepos().then(setRepos).catch((e) => setError(e.message));
      }, []);

      return html`
        <div class="wrap">
          <header>
            <h1>Ameet Mehta</h1>
            ${repos && html`<span class="count">${repos.length} projects</span>`}
            <a class="gh" href=${`https://github.com/${USER}`}>GitHub ↗</a>
          </header>

          <div class="row head">
            <span>Project</span>
            <span>Description</span>
            <span class="lang">Built with</span>
            <span class="started">Started</span>
            <span>Updated ↓</span>
          </div>

          ${error
            ? html`<div class="state">Couldn't load projects (${error}).
                See them on <a href=${`https://github.com/${USER}?tab=repositories`}>GitHub</a>.</div>`
            : !repos
            ? html`<div class="state">Loading…</div>`
            : repos.map((r) => html`<${Row} key=${r.id} repo=${r} />`)}
        </div>`;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
